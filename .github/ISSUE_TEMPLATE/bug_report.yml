name: Bug report
description: Something in a Net Forge package does not work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@netforge/engine 0.2.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest src/game.ts or command that shows it, if you can.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Node 22.12, Chrome 140 (WebGPU)"
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      render: text
