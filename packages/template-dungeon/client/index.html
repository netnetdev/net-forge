<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Cryptwick</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4ead8;
        --dim: #a79f91;
        --ember: #ffb347;
        --panel: rgba(12, 14, 20, 0.72);
        --line: rgba(255, 200, 140, 0.18);
        --bad: #ff5c5c;
        --xp: #7ad7ff;
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html, body { margin: 0; height: 100%; background: #0c1018; color: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; }
      .hud { position: fixed; z-index: 5; pointer-events: none; font-variant-numeric: tabular-nums; }
      .hud button, .hud .card { pointer-events: auto; }
      button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:active { transform: scale(0.97); }

      #top-left { top: max(12px, env(safe-area-inset-top)); left: 12px; width: min(300px, 34vw); }
      .bar { position: relative; height: 10px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 6px; }
      .bar > div { position: absolute; inset: 0; transform-origin: left; transition: transform 120ms linear; }
      #xp-fill { background: var(--xp); }
      #hp-fill { background: linear-gradient(90deg, #ff6b4a, #ffb347); }
      #level { font-weight: 800; letter-spacing: 0.06em; font-size: 15px; }
      #hp-text { position: absolute; right: 6px; top: -1px; font-size: 9px; color: #fff; text-shadow: 0 1px 2px #000; }
      #team { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12px; color: var(--dim); }
      #team li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
      #team .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
      #team em { font-style: normal; color: var(--ink); margin-left: auto; }
      #team small { min-width: 44px; text-align: right; }

      #top-center { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; }
      #timer { font-size: 28px; font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 2px 8px #000; }
      #wave { font-size: 11px; letter-spacing: 0.2em; color: var(--ember); }
      #boss { display: none; width: min(420px, 70vw); margin-top: 6px; }
      #boss.show { display: block; }
      #boss .boss-row + .boss-row { margin-top: 6px; }
      #boss .boss-name { font-size: 11px; letter-spacing: 0.18em; color: #ffd9a0; }
      #boss .bar { height: 8px; }
      #boss .boss-fill { background: linear-gradient(90deg, #b08d57, #ffe1a6); }

      #top-right { top: max(10px, env(safe-area-inset-top)); right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      #top-right .row { display: flex; gap: 6px; }
      #kills-box { font-size: 12px; color: var(--dim); }
      #kills { color: var(--ink); font-weight: 700; font-size: 16px; }

      #cards { left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(-50%, 140%); display: flex; gap: 10px; opacity: 0; transition: transform 260ms cubic-bezier(0.2, 1.4, 0.4, 1), opacity 160ms; }
      #cards.show { transform: translate(-50%, 0); opacity: 1; }
      .card { width: min(170px, 28vw); padding: 12px 12px 10px; border-radius: 14px; background: rgba(20, 16, 10, 0.88); border: 1px solid rgba(255, 179, 71, 0.45); text-align: left; display: grid; gap: 3px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }
      .card:hover { border-color: var(--ember); transform: translateY(-3px); }
      .card kbd { font: 700 10px ui-monospace, monospace; color: var(--ember); }
      .card b { font-size: 15px; }
      .card span { font-size: 12px; color: var(--dim); }
      .card i { font-style: normal; font-size: 10px; letter-spacing: 0.14em; color: var(--xp); text-transform: uppercase; }
      .card em { font-style: normal; font-size: 11px; color: #ffd9a0; }
      .card.evolve { border-color: #ffd36b; box-shadow: 0 0 22px rgba(255, 211, 107, 0.45); }
      .card-actions { display: grid; gap: 6px; align-content: end; }
      .card-actions button { font-size: 11px; padding: 6px 10px; border-radius: 10px; background: rgba(20, 16, 10, 0.8); border: 1px solid rgba(255, 179, 71, 0.3); color: var(--dim); }
      .card-actions button:disabled { opacity: 0.4; }
      #pending { position: absolute; right: -8px; top: -10px; font-size: 12px; color: var(--ember); }

      #downed { inset: 0; display: none; place-items: end center; padding-bottom: 22vh; background: radial-gradient(circle, transparent 45%, rgba(80, 0, 0, 0.35)); }
      #downed.show { display: grid; }
      #downed .box { text-align: center; }
      #downed-title { font-size: 34px; font-weight: 900; letter-spacing: 0.12em; color: var(--bad); }
      #downed-sub { color: var(--dim); margin: 4px 0 14px; }
      #revive-btn, #getup-btn { pointer-events: auto; border-color: var(--ember); }
      #getup-btn { background: rgba(255, 179, 71, 0.18); }
      #getup-btn kbd { font: inherit; font-size: 11px; opacity: 0.7; margin-left: 6px; }
      .downed-actions { display: flex; gap: 8px; justify-content: center; }

      #end { inset: 0; display: none; place-items: center; background: rgba(6, 8, 12, 0.72); }
      #end.show { display: grid; }
      #end .box { width: min(600px, 92vw); max-height: 88vh; overflow-y: auto; box-sizing: border-box; padding: 22px; border-radius: 18px; background: rgba(18, 16, 14, 0.94); border: 1px solid var(--line); text-align: center; pointer-events: auto; }
      #end-players { display: grid; gap: 10px; margin: 0 0 14px; text-align: left; }
      .end-player { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); }
      .end-player header { display: flex; align-items: baseline; gap: 8px; font-weight: 800; }
      .end-player header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); align-self: center; }
      .end-player header small { color: var(--dim); font-weight: 400; }
      .end-player .titles { margin-left: auto; color: #ffd36b; font-size: 12px; letter-spacing: 0.06em; }
      .end-player ul { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12px; }
      .end-player li { display: grid; grid-template-columns: 1fr auto 64px; gap: 8px; align-items: center; padding: 2px 0; }
      .end-player li .dmgbar { height: 5px; border-radius: 3px; background: var(--ember); transform-origin: left; }
      .end-player .line { font-size: 12px; color: var(--dim); margin-top: 6px; }
      #end-actions { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 12px; }
      #end-again { border-color: var(--ember); font-weight: 800; padding: 10px 18px; }
      #end-again.voted { background: rgba(255, 179, 71, 0.22); }

      #keepers { left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; gap: 8px; }
      #keepers.show { display: flex; }
      #end #keepers { position: static; transform: none; justify-content: center; margin-top: 14px; }
      .keeper { width: 128px; padding: 8px 10px; border-radius: 12px; text-align: left; display: grid; gap: 2px; border: 1px solid var(--line); }
      .keeper b { font-size: 13px; }
      .keeper small { font-size: 11px; color: var(--dim); }
      .keeper.on { border-color: var(--k, var(--ember)); box-shadow: 0 0 14px rgba(255, 179, 71, 0.35); }
      .keeper.locked { opacity: 0.5; cursor: default; }

      #inv { left: 12px; bottom: max(36px, calc(env(safe-area-inset-bottom) + 24px)); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: min(300px, 24vw); transition: opacity 160ms; }
      body:has(#cards.show) #inv { opacity: 0.25; }
      body:has(#stats.show) #inv { bottom: 96px; }
      #inv .slot { min-width: 30px; padding: 3px 6px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 11px; text-align: center; }
      #inv .slot { display: grid; justify-items: center; gap: 1px; color: #ffd9a0; }
      #inv .slot.passive { color: #9fdcff; }
      #inv .slot svg { display: block; }
      #inv .slot span { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
      #inv .slot.evolved { border-color: #ffd36b; }
      #inv .slot.passive { border-color: rgba(122, 215, 255, 0.35); }
      #dash-ring { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--ember) calc(var(--p) * 360deg), rgba(255, 255, 255, 0.1) 0); display: grid; place-items: center; }
      #dash-ring::after { content: "DASH"; font-size: 7px; font-weight: 800; letter-spacing: 0.06em; width: 22px; height: 22px; border-radius: 50%; background: rgba(12, 14, 20, 0.9); display: grid; place-items: center; }
      #next { font-size: 11px; letter-spacing: 0.16em; color: #ffd9a0; margin-top: 2px; }
      #goals { list-style: none; padding: 0; margin: 10px 0 0; font-size: 11px; color: var(--dim); }
      #goals li { display: flex; gap: 6px; padding: 1px 0; }
      #goals li.done { color: #ffd36b; }
      #goals li em { font-style: normal; margin-left: auto; }
      .dmg.crit { font-size: 22px; color: #ffd23f; }
      #end-title { font-size: 26px; font-weight: 900; letter-spacing: 0.1em; color: var(--ember); }
      #end-stats { display: flex; justify-content: space-around; margin: 16px 0; }
      #end-stats small { display: block; color: var(--dim); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
      #end-stats b { font-size: 22px; }
      #end-earned { list-style: none; padding: 0; margin: 0 0 12px; text-align: left; font-size: 14px; }
      #end-earned li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); }
      #end-earned b { color: var(--ember); }
      #end-next { color: var(--dim); font-size: 12px; }

      #store { top: 0; right: 0; bottom: 0; width: min(320px, 86vw); background: rgba(14, 12, 10, 0.96); border-left: 1px solid var(--line); padding: 18px; box-sizing: border-box; transform: translateX(100%); transition: transform 220ms ease; pointer-events: auto; }
      #store.show { transform: none; }
      #store h2 { margin: 0 0 4px; font-size: 16px; letter-spacing: 0.12em; }
      #store .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
      #store .swatch { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #3cf2c4, #a77bff); margin-right: 10px; }
      #store small { color: var(--dim); }
      #store-close { margin-top: 14px; }
      /* The coin sits on its own dark plate, so nothing in the scene runs through it. */
      #coin-box { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 3px 10px; border-radius: 10px; background: rgba(12, 10, 8, 0.86); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
      #coin-box.guest b { color: var(--dim); font-weight: 600; }
      /* Play money: a second line inside the plate, so the plate (and the Store row under it) makes room for it. */
      #coin-box.play { display: block; text-align: right; }
      #coin-box.play #coin-logo { vertical-align: middle; margin-right: 6px; }
      #coin-box.play::after { content: "play money"; display: block; margin-top: 1px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      #end-earned li.guest { color: var(--dim); }
      #coin-logo { border-radius: 50%; }

      #markers .marker { position: absolute; left: 0; top: 0; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--c); box-sizing: border-box; background: conic-gradient(var(--c) calc(var(--p) * 360deg), rgba(0, 0, 0, 0.45) 0); opacity: 0.9; }
      #markers .marker.off:not(.down) { width: 14px; height: 14px; border-width: 2px; background: var(--c); }
      #markers .marker.down { animation: pulse 0.9s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 80, 80, 0.25); } }

      .dmg { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; font: 800 14px ui-rounded, system-ui, sans-serif; color: #fff; text-shadow: 0 1px 0 #000, 0 0 6px rgba(0, 0, 0, 0.7); opacity: 0; will-change: transform, opacity; }
      .dmg.big { font-size: 20px; color: #ffd36b; }

      #toast { left: 50%; top: 92px; transform: translate(-50%, -10px); padding: 8px 14px; border-radius: 999px; background: rgba(20, 16, 10, 0.9); border: 1px solid var(--ember); font-weight: 700; opacity: 0; transition: opacity 200ms, transform 200ms; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #announce { left: 50%; top: 28%; transform: translate(-50%, -50%) scale(0.92); text-align: center; opacity: 0; transition: opacity 220ms, transform 260ms cubic-bezier(0.2, 1.4, 0.4, 1); pointer-events: none; }
      #announce.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      #announce-text { font-size: clamp(22px, 4.2vw, 44px); font-weight: 900; letter-spacing: 0.12em; color: #fff3dc; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 0 28px rgba(255, 160, 64, 0.55); }
      #announce.danger #announce-text { color: #ffd2c4; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 70, 40, 0.75); }
      #announce.reward #announce-text { color: #fff1b0; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 211, 107, 0.8); }
      #arrows .arrow { position: absolute; left: 0; top: 0; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 22px solid #ffb347; filter: drop-shadow(0 0 6px rgba(255, 140, 40, 0.9)); }
      #hurt { inset: 0; background: radial-gradient(circle, transparent 45%, rgba(255, 40, 40, 0.5)); opacity: 0; }
      #stats { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); font: 11px/1.4 ui-monospace, monospace; color: var(--dim); white-space: pre; display: none; }
      #stats.show { display: block; }
      #help { right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--dim); text-align: right; }
      /* The first 5 s of a run: the controls, centred under your keeper. */
      #intro { left: 50%; top: 64%; transform: translate(-50%, 0); padding: 10px 18px; border-radius: 999px; background: rgba(12, 10, 8, 0.72); border: 1px solid var(--line); font-size: 18px; font-weight: 700; letter-spacing: 0.04em; opacity: 0; transition: opacity 400ms; }
      #intro.show { opacity: 1; }
      /* Your own level-up: a warm flash from the edges and a word, for you only. */
      #lvlflash { inset: 0; display: grid; place-items: center; opacity: 0; background: radial-gradient(circle, transparent 35%, rgba(255, 196, 90, 0.38)); }
      #lvlflash b { font-size: 44px; font-weight: 900; letter-spacing: 0.2em; color: #ffe2a0; text-shadow: 0 0 24px rgba(255, 170, 60, 0.9); transform: translateY(-14vh) scale(0.9); }
      #lvlflash.go { animation: lvlflash 700ms ease-out; }
      #lvlflash.go b { animation: lvlword 700ms cubic-bezier(0.2, 1.4, 0.4, 1); }
      @keyframes lvlflash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes lvlword { 0% { transform: translateY(-14vh) scale(0.6); } 30% { transform: translateY(-14vh) scale(1.08); } 100% { transform: translateY(-15vh) scale(1); } }
      @media (prefers-reduced-motion: reduce) { #lvlflash.go, #lvlflash.go b { animation-duration: 1ms; } }
      #banner { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 15px; color: var(--dim); }
      #banner b { display: block; font-size: 42px; letter-spacing: 0.18em; color: var(--ember); margin-bottom: 6px; }

      .stick-zone { position: fixed; left: 0; top: 70px; bottom: 0; width: 62%; z-index: 3; touch-action: none; }
      .dash-button { position: fixed; right: 22px; bottom: max(28px, env(safe-area-inset-bottom)); z-index: 6; width: 82px; height: 82px; border-radius: 50%; border: 2px solid var(--ember); background: rgba(255, 179, 71, 0.16); font-weight: 800; letter-spacing: 0.08em; }
      /* Framed by Net Forge: the host's own Invite and Connect replace these. */
      html[data-host="netnet"] #invite, html[data-host="netnet"] #signin { display: none; }
      @media (pointer: coarse) {
        #help, #intro { display: none; }
        #cards { bottom: 128px; }
        .card { width: 30vw; padding: 10px; }
      }
      @media (max-width: 560px) {
        #team { display: none; }
        #timer { font-size: 22px; }
        /* Phones: the boss bar keeps to the centre column, clear of the HP bar, and the
           three picks fit the screen with Reroll and Skip in a row under them. */
        #boss { width: 26vw; }
        #next { max-width: 26vw; margin: 2px auto 0; font-size: 10px; letter-spacing: 0.06em; }
        #boss .boss-name { font-size: 10px; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #cards { width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; gap: 6px; }
        .card { width: calc((100vw - 32px) / 3); padding: 8px; }
        .card-actions { grid-auto-flow: column; justify-content: center; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hurt" class="hud"></div>
    <div id="markers" class="hud" style="inset: 0"></div>

    <div id="top-left" class="hud">
      <div id="level">LV 1</div>
      <div class="bar"><div id="xp-fill"></div></div>
      <div class="bar" style="height: 12px"><div id="hp-fill"></div><span id="hp-text"></span></div>
      <ul id="team"></ul>
      <ul id="goals"></ul>
    </div>
    <div id="top-center" class="hud">
      <div id="timer">0:00</div>
      <div id="wave"></div>
      <div id="next"></div>
      <div id="boss"></div>
    </div>
    <div id="top-right" class="hud">
      <div id="kills-box">Kills <span id="kills">0</span></div>
      <div id="coin-box"><img id="coin-logo" alt="" width="18" height="18" hidden /><b id="coin-balance"></b></div>
      <div class="row"><button id="invite">Invite</button><button id="store-btn">Store</button></div>
      <div class="row"><button id="sound">Sound on</button><button id="signin">Sign in to save</button></div>
    </div>

    <div id="cards" class="hud">
      <button class="card" id="card0"></button>
      <button class="card" id="card1"></button>
      <button class="card" id="card2"></button>
      <span id="pending"></span>
      <div class="card-actions"><button id="reroll">Reroll</button><button id="skip">Skip</button></div>
    </div>

    <div id="downed" class="hud"><div class="box"><div id="downed-title">DOWNED</div><div id="downed-sub"></div><div class="downed-actions"><button id="getup-btn">Get up <kbd>Space</kbd></button><button id="revive-btn">Revive</button></div></div></div>

    <div id="end" class="hud">
      <div class="box">
        <div id="end-title"></div>
        <div id="end-stats"></div>
        <div id="end-players"></div>
        <ul id="end-earned"></ul>
        <div id="end-keeper-slot"></div>
        <div id="end-actions"><button id="end-again">Play again</button><div id="end-next"></div></div>
      </div>
    </div>

    <aside id="store" class="hud">
      <h2>STORE</h2>
      <small id="coin-name"></small>
      <div class="item"><div style="display: flex; align-items: center"><span class="swatch"></span><div>Ossuary palette<br /><small>Cosmetic</small></div></div><button id="buy-ossuary"></button></div>
      <div class="item"><div>Revive<br /><small>Spend while downed</small></div><small id="revive-price"></small></div>
      <div class="item" id="gear-row"><div style="display: block"><span id="gear-name"></span><br /><small id="gear-line"></small></div><button id="gear-buy" style="white-space: nowrap"></button></div>
      <div class="item" id="stake-row"><div>Stake a run<br /><small id="stake-line"></small></div><span style="white-space: nowrap"><input id="stake-amount" type="number" aria-label="Stake" style="width: 56px" /> <button id="stake-go" style="min-width: 0">Stake</button></span></div>
      <small id="store-note"></small>
      <br /><button id="store-close">Close</button>
    </aside>

    <div id="keepers" class="hud"></div>
    <div id="inv" class="hud"><div id="dash-ring" style="--p: 1"></div></div>
    <div id="toast" class="hud"></div>
    <div id="announce" class="hud"><div id="announce-text"></div></div>
    <div id="arrows" class="hud" style="inset: 0"></div>
    <div id="stats" class="hud"></div>
    <div id="help" class="hud">WASD move &middot; Space dash &middot; 1 2 3 pick</div>
    <div id="intro" class="hud">WASD move &middot; Space dash</div>
    <div id="lvlflash" class="hud"><b>LEVEL UP</b></div>
    <div id="banner" class="hud"><b>CRYPTWICK</b><span id="banner-text">Lighting the wicks</span></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
